name: Daily AI News Intelligence (WeCom 5-Part)

on:
  schedule:
    # UTC 23:30 对应北京时间次日早上 07:30
    - cron: '30 23 * * *'
  workflow_dispatch: # 支持手动点击按钮立即测试

jobs:
  build-and-push-news:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安装依赖库
        run: pip install -r requirements.txt

      - name: 4. 执行情报抓取、5分类拆分与企微推送
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          # 如需在“个人微信-企业微信插件”中直接查看纯文本，可将下方改为 text
          WECOM_MSG_TYPE: "markdown"
        run: python main.py
