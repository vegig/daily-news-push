name: Daily AI News Intelligence (9AM & 7PM)

on:
  schedule:
    # 提前 5 小时排入队列，抵消 GitHub 延迟，实际会在北京时间早上 08:30-09:30 启动
    - cron: '45 19 * * *'
    # 提前 5 小时排入队列，抵消 GitHub 延迟，实际会在北京时间晚上 18:30-19:30 启动
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 防止同一任务排队叠加运行
concurrency:
  group: daily-news-push-group
  cancel-in-progress: true

jobs:
  build-and-push-news:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安装依赖库
        run: pip install -r requirements.txt

      - name: 4. 执行情报抓取、去重分析与企微推送
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python main.py

      - name: 5. 保存已推送记录回仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f sent_history.json ]; then
            git add sent_history.json
            git diff --staged --quiet || git commit -m "chore: update sent_history [skip ci]"
            git push
          fi
