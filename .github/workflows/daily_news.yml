name: Daily AI News Intelligence (9AM & 7PM)

on:
  schedule:
    # 错峰技巧：设为 53 分触发，完美避开全球 00 分整点排队拥堵！
    # UTC 00:53 = 北京时间早上 08:53（跑完刚好约 08:55-09:00 送达）
    - cron: '53 0 * * *'
    # UTC 10:53 = 北京时间晚上 18:53（跑完刚好约 18:55-19:00 送达）
    - cron: '53 10 * * *'
  workflow_dispatch: # 手动点击按钮测试时不受时间限制

permissions:
  contents: write

# 防止同一任务排队叠加运行
concurrency:
  group: daily-news-push-group
  cancel-in-progress: true

jobs:
  build-and-push-news:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安装依赖库
        run: pip install -r requirements.txt

      - name: 4. 执行情报抓取、去重分析与企微推送
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python main.py

      - name: 5. 保存已推送记录回仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f sent_history.json ]; then
            git add sent_history.json
            git diff --staged --quiet || git commit -m "chore: update sent_history [skip ci]"
            git push
          fi
